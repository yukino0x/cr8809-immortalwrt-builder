name: Build CR8809 ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches: [ "build/cr8809-custom" ]
    paths:
      - "configs/**"
      - ".github/workflows/build-cr8809.yml"

permissions:
  contents: read

concurrency:
  group: cr8809-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout pinned zcop source
        uses: actions/checkout@v4
        with:
          repository: zcop/immortalwrt
          ref: 2db347236cb6fa1ca9fea893d93b1cbc6085e073
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget jq curl zstd

      - name: Pin feeds and add OpenClash
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          git -C feeds/packages checkout 39f4c789babdc98a9f13205b96301842f2d1a9ec
          git -C feeds/luci checkout 6da86dba37ad73cdde635f827db29ce275aebe48
          git -C feeds/routing checkout 776e7160636a7f1add27483ac926dadeb248bb65
          git -C feeds/telephony checkout e2c5adab62e25eddeff3e52d4678163f6c9a6c3a
          git -C feeds/video checkout 060d917e7068e13e4659aaae92df4c81c6f2e5be
          ./scripts/feeds install -a
          mkdir -p package/custom
          git clone --depth 1 --branch v0.47.088 https://github.com/vernesong/OpenClash.git package/custom/OpenClash
          test -f package/custom/OpenClash/luci-app-openclash/Makefile
          test -f feeds/packages/net/adguardhome/Makefile
          test -f feeds/luci/applications/luci-app-adguardhome/Makefile

      - name: Configure CR8809
        run: |
          cp configs/cr8809.config .config
          make defconfig
          ./scripts/diffconfig.sh > build.config
          grep -q 'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_redmi_ax3000=y' .config
          grep -q 'CONFIG_PACKAGE_luci-app-openclash=y' .config
          grep -q 'CONFIG_PACKAGE_adguardhome=y' .config
          grep -q 'CONFIG_PACKAGE_luci-app-adguardhome=y' .config

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Validate image and packages
        shell: bash
        run: |
          set -euxo pipefail
          find bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f -printf '%f %s bytes\\n'
          UBI=$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*redmi_ax3000*squashfs-factory.ubi' -print -quit)
          test -n "$UBI"
          SIZE=$(stat -c '%s' "$UBI")
          echo "Factory UBI size: $SIZE bytes"
          test "$SIZE" -le 37748736
          sha256sum "$UBI" | tee firmware.sha256
          cp "$UBI" cr8809-immortalwrt-custom.ubi
          cp build.config cr8809-build.config

      - name: Upload firmware and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: cr8809-immortalwrt-${{ github.run_number }}
          path: |
            cr8809-immortalwrt-custom.ubi
            firmware.sha256
            cr8809-build.config
            build.log
            bin/targets/qualcommax/ipq50xx/packages/
          if-no-files-found: error
          retention-days: 30
