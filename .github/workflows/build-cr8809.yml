name: Build CR8809 ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches: ["build/cr8809-custom"]
    paths:
      - "configs/**"
      - ".github/workflows/build-cr8809.yml"

permissions:
  contents: read

concurrency:
  group: cr8809-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout pinned zcop source
        uses: actions/checkout@v4
        with:
          repository: zcop/immortalwrt
          ref: 2db347236cb6fa1ca9fea893d93b1cbc6085e073
          fetch-depth: 1

      - name: Checkout builder configuration
        uses: actions/checkout@v4
        with:
          path: builder
          ref: build/cr8809-custom

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget jq curl zstd

      - name: Pin feeds and add OpenClash
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a

          git -C feeds/packages fetch --depth=1 origin 39f4c789babdc98a9f13205b96301842f2d1a9ec
          git -C feeds/luci fetch --depth=1 origin 55a4b33aafe74aeda6984f80d98750286204dd79
          git -C feeds/routing fetch --depth=1 origin 776e7160636a7f1add27483ac926dadeb248bb65
          git -C feeds/telephony fetch --depth=1 origin e2c5adab62e25eddeff3e52d4678163f6c9a6c3a
          git -C feeds/video fetch --depth=1 origin 060d917e7068e13e4659aaae92df4c81c6f2e5be
          git -C feeds/zcopapp fetch --depth=1 origin 95000137987cb750898fea3b2c01eb70f0c79c7e
          git -C feeds/cr881xwanmode fetch --depth=1 origin cca0d4f8bce6171ffe7785082d67792004b6ca30
          git -C feeds/wanconduit fetch --depth=1 origin 6b187cb4644de43b114164ab8ab9a1bdfe62f2e5

          git -C feeds/packages checkout 39f4c789babdc98a9f13205b96301842f2d1a9ec
          git -C feeds/luci checkout 55a4b33aafe74aeda6984f80d98750286204dd79
          git -C feeds/routing checkout 776e7160636a7f1add27483ac926dadeb248bb65
          git -C feeds/telephony checkout e2c5adab62e25eddeff3e52d4678163f6c9a6c3a
          git -C feeds/video checkout 060d917e7068e13e4659aaae92df4c81c6f2e5be
          git -C feeds/zcopapp checkout 95000137987cb750898fea3b2c01eb70f0c79c7e
          git -C feeds/cr881xwanmode checkout cca0d4f8bce6171ffe7785082d67792004b6ca30
          git -C feeds/wanconduit checkout 6b187cb4644de43b114164ab8ab9a1bdfe62f2e5

          ./scripts/feeds install -a

          # Expose the versioned Go host package required by AdGuard Home 0.107.74.
          mkdir -p package/feeds/packages
          ln -sfn "$GITHUB_WORKSPACE/feeds/packages/lang/golang/golang1.26" package/feeds/packages/golang1.26
          test -f package/feeds/packages/golang1.26/Makefile

          # Add the Chinese AdGuard Home LuCI translation missing from this pinned LuCI snapshot.
          mkdir -p feeds/luci/applications/luci-app-adguardhome/po/zh_Hans
          curl -fL --retry 3 --connect-timeout 30 -o feeds/luci/applications/luci-app-adguardhome/po/zh_Hans/adguardhome.po https://raw.githubusercontent.com/immortalwrt/luci/6da86dba37ad73cdde635f827db29ce275aebe48/applications/luci-app-adguardhome/po/zh_Hans/adguardhome.po
          test -s feeds/luci/applications/luci-app-adguardhome/po/zh_Hans/adguardhome.po

          # OpenClash package Makefile lives one directory below its Git repository root.
          git clone --depth 1 --branch v0.47.088 https://github.com/vernesong/OpenClash.git /tmp/OpenClash
          test -f /tmp/OpenClash/luci-app-openclash/Makefile
          mkdir -p package/custom
          cp -a /tmp/OpenClash/luci-app-openclash package/custom/luci-app-openclash
          mkdir -p package/custom/luci-app-openclash/root/etc/openclash/core
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/mihomo-arm64.tar.gz https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-arm64.tar.gz
          tar -tzf /tmp/mihomo-arm64.tar.gz | grep -qx clash
          tar -xzf /tmp/mihomo-arm64.tar.gz -C /tmp clash
          install -m 0755 /tmp/clash package/custom/luci-app-openclash/root/etc/openclash/core/clash_meta

          test -f feeds/packages/net/adguardhome/Makefile
          test -f feeds/luci/applications/luci-app-adguardhome/Makefile
          test -f package/custom/luci-app-openclash/Makefile

      - name: Configure CR8809
        run: |
          cp builder/configs/cr8809.config .config
          make defconfig
          ./scripts/diffconfig.sh > build.config
          grep -q 'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_redmi_ax3000=y' .config
          grep -q 'CONFIG_PACKAGE_luci-app-openclash=y' .config
          grep -q 'CONFIG_PACKAGE_adguardhome=y' .config
          grep -q 'CONFIG_PACKAGE_luci-app-adguardhome=y' .config

      - name: Download sources
        run: make download -j8

      - name: Build and verify Go 1.26.2 host toolchain
        shell: bash
        run: |
          set -euxo pipefail
          make package/feeds/packages/golang/host/compile -j2 V=s
          test -x staging_dir/hostpkg/lib/go-1.26/bin/go
          staging_dir/hostpkg/lib/go-1.26/bin/go version
          staging_dir/hostpkg/lib/go-1.26/bin/go version | grep -q 'go1.26.2'

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Validate image and packages
        shell: bash
        run: |
          set -euxo pipefail
          find bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f -printf '%f %s bytes\\n'
          UBI=$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*redmi_ax3000*squashfs-factory.ubi' -print -quit)
          test -n "$UBI"
          SIZE=$(stat -c '%s' "$UBI")
          echo "Factory UBI size: $SIZE bytes"
          test "$SIZE" -le 37748736
          sha256sum "$UBI" | tee firmware.sha256
          cp "$UBI" cr8809-immortalwrt-custom.ubi
          cp build.config cr8809-build.config

      - name: Upload firmware and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: cr8809-immortalwrt-${{ github.run_number }}
          path: |
            cr8809-immortalwrt-custom.ubi
            firmware.sha256
            cr8809-build.config
            build.log
            bin/targets/qualcommax/ipq50xx/packages/
          if-no-files-found: error
          retention-days: 30
